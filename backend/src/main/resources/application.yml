spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: sports-session-platform

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sports_session}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
    clean-disabled: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

rating:
  reconciliation:
    enabled: true
    fixed-delay-ms: 5000